exporters:
  coralogix:
    application_name: otel
    application_name_attributes:
      - aws.ecs.cluster.name
      - aws.ecs.task.definition.family
    domain: coralogix.us
    domain_settings:
      keepalive:
        enabled: true
        permit_without_stream: false
        time: 30s
        timeout: 10s
    logs:
      headers:
        X-Coralogix-Distribution: ecs-ec2-integration/0.0.30
    metrics:
      headers:
        X-Coralogix-Distribution: helm-otel-integration/0.0.30
    private_key: ${env:CORALOGIX_PRIVATE_KEY}
    profiles:
      headers:
        X-Coralogix-Distribution: helm-otel-integration/0.0.30
        x-coralogix-ingress: otlp/v1.10.0
    sending_queue:
      batch:
        flush_timeout: 250ms
        max_size: 2097152
        min_size: 1048576
        sizer: bytes
      enabled: true
      num_consumers: 20
      queue_size: 209715200
      sizer: bytes
    subsystem_name: integration
    subsystem_name_attributes:
      - aws.ecs.container.name
      - aws.ecs.docker.name
      - docker.name
    timeout: 30s
    traces:
      headers:
        X-Coralogix-Distribution: helm-otel-integration/0.0.30
extensions:
  health_check:
    endpoint: ${env:MY_POD_IP}:13133
  opamp:
    agent_description:
      include_resource_attributes: true
      non_identifying_attributes:
        cx.agent.type: agent
        cx.cluster.name: "stg-cyber4all-cluster-use1-c8ef755f"
        helm.chart.opentelemetry-ebpf-profiler.version: 0.131.7
    server:
      http:
        endpoint: https://ingress.coralogix.us/opamp/v1
        headers:
          Authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY}
        polling_interval: 2m
processors:
  ecsattributes/container-logs:
    container_id:
      sources:
        - log.file.path
        - container.id
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource/metadata:
    attributes:
      - action: upsert
        key: k8s.cluster.name
        value: "${env:CLUSTER_NAME}"
      - action: upsert
        key: cx.otel_integration.name
        value: coralogix-integration-ecs-ec2
  resourcedetection/env:
    detectors:
      - system
      - env
    override: false
    system:
      resource_attributes:
        host.id:
          enabled: true
    timeout: 2s
  resourcedetection/region:
    detectors:
      - ec2
    override: true
    timeout: 2s
  transform/profiles-ecs-service-name:
    profile_statements:
      - context: resource
        statements:
          - set(resource.attributes["service.name"], resource.attributes["aws.ecs.task.definition.family"])
            where (resource.attributes["service.name"] == nil or resource.attributes["service.name"]
            == "") and resource.attributes["aws.ecs.task.definition.family"] != nil and
            resource.attributes["aws.ecs.task.definition.family"] != ""
          - set(resource.attributes["service.name"], resource.attributes["aws.ecs.container.name"])
            where (resource.attributes["service.name"] == nil or resource.attributes["service.name"]
            == "") and resource.attributes["aws.ecs.container.name"] != nil and resource.attributes["aws.ecs.container.name"]
            != ""
receivers:
  profiling:
    off_cpu_threshold: 0
    probabilistic_interval: 1m
    probabilistic_threshold: 100
    reporter_interval: "30s"
    samples_per_second: 20
    tracers: all
    verbose_mode: false
service:
  extensions:
    - health_check
    - opamp
  pipelines:
    profiles:
      exporters:
        - coralogix
      processors:
        - memory_limiter
        - resourcedetection/region
        - resourcedetection/env
        - ecsattributes/container-logs
        - transform/profiles-ecs-service-name
      receivers:
        - profiling
  telemetry:
    logs:
      encoding: json
